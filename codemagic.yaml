workflows:
  capacitor-ios:
    name: Capacitor iOS Build
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      vars:
        BUNDLE_ID: app.fillsell.app
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.fillsell.app
    integrations:
      app_store_connect: Codemagic
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: |
          rm -rf node_modules/.vite
          npm run build
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Restore App.entitlements
        script: |
          cat > ios/App/App/App.entitlements << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.applesignin</key>
              <array>
                  <string>Default</string>
              </array>
          </dict>
          </plist>
          EOF
      # ⚠️ CETTE ÉTAPE ÉCRASE le fichier que `npx cap sync ios` vient de
      # générer. Tout plugin ajouté au projet DOIT donc être répercuté ICI À LA
      # MAIN, sinon il est absent du binaire iOS alors que tout est correct
      # côté sources — panne silencieuse, invisible en local.
      # Le seul contenu qui justifie l'écrasement est AppleSignInPlugin
      # (plugin natif maison, ios/App/App/AppleSignInPlugin.swift, que cap sync
      # ne peut pas connaître).
      # DETTE CONNUE (2026-07-29) : le bloc SplashScreen ci-dessous a dérivé de
      # capacitor.config.ts (backgroundColor #1D9E75 ici, #10201B en source
      # depuis le 26/07 ; launchAutoHide / launchFadeOutDuration /
      # androidScaleType absents). NON corrigé volontairement — ce serait un
      # changement visuel non demandé dans le build soumis ce soir. À traiter à
      # part, idéalement en remplaçant cet écrasement par un patch jq du
      # fichier généré.
      - name: Fix capacitor.config.json
        script: |
          cat > ios/App/App/capacitor.config.json << 'EOF'
          {
            "appId": "app.fillsell.app",
            "appName": "FillSell",
            "webDir": "dist",
            "server": { "androidScheme": "https" },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 2000,
                "backgroundColor": "#1D9E75",
                "showSpinner": false
              },
              "CapacitorUpdater": {
                "autoUpdate": "atBackground",
                "defaultChannel": "production",
                "appReadyTimeout": 10000,
                "resetWhenUpdate": true
              }
            },
            "packageClassList": [
              "AppPlugin",
              "CAPBrowserPlugin",
              "CAPCameraPlugin",
              "CameraPlugin",
              "SplashScreenPlugin",
              "CapacitorUpdaterPlugin",
              "NativePurchasesPlugin",
              "AppleSignInPlugin"
            ]
          }
          EOF
      - name: Verify capacitor.config.json
        script: |
          echo "=== capacitor.config.json content ==="
          cat ios/App/App/capacitor.config.json
          # Garde (2026-07-29) : l'étape précédente écrase un fichier généré.
          # Un plugin oublié dans packageClassList ne casse RIEN au build — il
          # produit un binaire où le plugin n'existe pas, constat repoussé à
          # TestFlight. On échoue ici, tout de suite, plutôt que là-bas.
          for classe in CapacitorUpdaterPlugin NativePurchasesPlugin AppleSignInPlugin; do
            if ! grep -q "\"$classe\"" ios/App/App/capacitor.config.json; then
              echo "ERREUR : $classe absent de packageClassList — plugin non embarqué dans le binaire iOS"
              exit 1
            fi
          done
          echo "packageClassList : plugins critiques présents"
      - name: Set build number
        script: |
          # 2.3 = la soumission SUIVANTE (la review 2.2 est en cours sur ASC —
          # ne pas lancer ce build avant sa validation). Aligné sur Android
          # versionName 2.3 / versionCode 19.
          BUILD_NUMBER=$(date +%y%m%d%H%M)
          echo "Build number (timestamp): $BUILD_NUMBER"
          cd ios/App && agvtool new-marketing-version 2.3 && agvtool new-version -all $BUILD_NUMBER
      - name: Build IPA
        script: |
          xcode-project use-profiles
          cat > /tmp/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>BQ379Y93X3</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.fillsell.app</key>
              <string>FillSell AppStore</string>
            </dict>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          EOF
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --config Release \
            --export-options-plist /tmp/ExportOptions.plist
      # ══════════════════════════════════════════════════════════════════════
      # CAPGO — UPLOAD DU BUNDLE OTA : DÉSACTIVÉ (2026-07-29)
      # ══════════════════════════════════════════════════════════════════════
      # NE PAS activer tant que le binaire CONTENANT le runtime Capgo n'est pas
      # réellement en production sur l'App Store. Avant ça, un bundle uploadé
      # n'est servi à personne : le parc installé tourne sur des binaires sans
      # le plugin, qui n'interrogent jamais Capgo.
      #
      # À faire avant de décommenter :
      #   1. créer CAPGO_TOKEN dans un groupe de variables CHIFFRÉ Codemagic
      #      (Settings > Environment variables) — JAMAIS en dur dans ce fichier ;
      #   2. déclarer le groupe sous environment: groups: [capgo] ;
      #   3. créer le canal « production » dans le dashboard Capgo — il doit
      #      correspondre exactement à defaultChannel de capacitor.config.ts,
      #      sinon le serveur ne renvoie jamais de bundle, sans erreur visible ;
      #   4. VÉRIFIER LA VERSION DU BUNDLE. Le CLI la prend par défaut dans
      #      package.json ("version": "2.4.0" depuis le 05/08 — c'était "2.4",
      #      deux segments, que le CLI refuse : ce n'est pas du semver) alors
      #      que ce workflow fige la marketing version iOS à 2.3 (étape
      #      « Set build number »).
      #      Capgo compare la version du bundle à celle installée : un bundle
      #      numéroté plus bas que le natif n'est pas servi. Aligner les deux,
      #      ou forcer explicitement avec --bundle <version>.
      #
      # - name: Upload Capgo bundle
      #   script: |
      #     npx @capgo/cli@latest bundle upload app.fillsell.app \
      #       --apikey "$CAPGO_TOKEN" \
      #       --path dist \
      #       --channel production \
      #       --comment "$CM_COMMIT"
      #   # Le CLI refuse l'upload s'il ne trouve pas notifyAppReady() dans les
      #   # sources (garde intégrée). Si ça arrive, c'est une régression de
      #   # src/main.jsx — corriger, surtout ne pas passer --no-code-check.
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
