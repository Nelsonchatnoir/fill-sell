workflows:
  capacitor-ios:
    name: Capacitor iOS Build
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      vars:
        BUNDLE_ID: app.fillsell.app
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.fillsell.app
    integrations:
      app_store_connect: Codemagic
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: |
          rm -rf node_modules/.vite
          npm run build
          # Images de partage social (Open Graph) : utiles au WEB, inutiles dans
          # un binaire. Elles pesaient 1,79 Mo sur 6,11 Mo de bundle — 29 % de
          # ce que chaque nouvel arrivant télécharge, pour des balises <meta>
          # que personne ne lit sur un téléphone. On ne touche PAS
          # og-image-fillsell.png (240 Ko, référencée par index.html).
          rm -f dist/og-image.png dist/og-image-en.png
          echo "Poids du bundle embarqué : $(du -sh dist | cut -f1)"
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Restore App.entitlements
        script: |
          cat > ios/App/App/App.entitlements << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.applesignin</key>
              <array>
                  <string>Default</string>
              </array>
          </dict>
          </plist>
          EOF
      # ── capacitor.config.json : le fichier GÉNÉRÉ fait foi (2026-09-16) ──
      # AVANT, cette étape RÉÉCRIVAIT le fichier entier avec un contenu figé
      # dans ce YAML. Effet mesuré : capacitor.config.ts n'atteignait jamais le
      # binaire iOS. Le bloc figé avait dérivé — backgroundColor #1D9E75 quand
      # la source dit #10201B depuis le 26/07, et launchAutoHide,
      # launchFadeOutDuration, androidScaleType absents. Le splash livré ne
      # ressemblait pas au design system, et aucune relecture des sources ne
      # pouvait le montrer.
      # Le script n'AJOUTE plus que ce que cap sync ne peut pas deviner
      # (AppleSignInPlugin, plugin natif maison) et échoue si un plugin
      # critique manque — un plugin oublié ne casse pas le build, il produit un
      # binaire muet dont on ne s'aperçoit qu'au TestFlight.
      - name: Patch capacitor.config.json
        script: node scripts/patch-ios-capacitor-config.mjs
      - name: Set build number
        script: |
          # ⚠️ CE NUMÉRO EST FIGÉ ICI, ET IL ÉCRASE LE pbxproj. Il est resté à
          # 2.3 du 27/07 au 16/09 : bumper MARKETING_VERSION dans Xcode ne
          # servait à rien, agvtool le ramenait à 2.3 à chaque build. Toute
          # montée de version passe par CETTE ligne, pas seulement par le
          # pbxproj — sinon le binaire repart sous l'ancien numéro.
          # 2.7 (16/09) : premier binaire depuis le 27/07. Aligné sur
          # package.json 2.7.0 et Android versionName 2.7.0 / versionCode 29.
          # L'alignement avec package.json n'est pas cosmétique : Capgo compare
          # la version d'un bundle OTA à celle du natif installé et ne sert
          # jamais un bundle numéroté plus bas.
          #
          # 2.8 (20/09) : rattrape la prod. Le parc du store tournait sur le
          # binaire 2.7 + l'OTA 2.7.27 ; un nouvel inscrit lançait donc 2.7 nu
          # et voyait une version en retard jusqu'au premier passage en fond.
          # Aligné sur package.json 2.8.0 et Android versionName 2.8.0 /
          # versionCode 30.
          #
          # ⛔ CE BINAIRE DÉPLACE LE PLANCHER DES OTA. Le canal Capgo sert
          #    2.7.27 : sur un natif 2.8, ce bundle est SOUS le plancher et ne
          #    sera JAMAIS servi (channel « Updates Under Native: No »). La
          #    prochaine OTA doit donc être numérotée 2.8.1 ou au-dessus —
          #    jamais 2.7.28. Elle sera servie aux deux parcs : > 2.7.27 pour
          #    qui est resté sur le binaire 2.7, > 2.8 pour qui a pris le neuf.
          BUILD_NUMBER=$(date +%y%m%d%H%M)
          echo "Build number (timestamp): $BUILD_NUMBER"
          cd ios/App && agvtool new-marketing-version 2.8 && agvtool new-version -all $BUILD_NUMBER
      - name: Build IPA
        script: |
          xcode-project use-profiles
          cat > /tmp/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>BQ379Y93X3</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.fillsell.app</key>
              <string>FillSell AppStore</string>
            </dict>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          EOF
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --config Release \
            --export-options-plist /tmp/ExportOptions.plist
      # ══════════════════════════════════════════════════════════════════════
      # CAPGO — UPLOAD DU BUNDLE OTA : DÉSACTIVÉ (2026-07-29)
      # ══════════════════════════════════════════════════════════════════════
      # NE PAS activer tant que le binaire CONTENANT le runtime Capgo n'est pas
      # réellement en production sur l'App Store. Avant ça, un bundle uploadé
      # n'est servi à personne : le parc installé tourne sur des binaires sans
      # le plugin, qui n'interrogent jamais Capgo.
      #
      # À faire avant de décommenter :
      #   1. créer CAPGO_TOKEN dans un groupe de variables CHIFFRÉ Codemagic
      #      (Settings > Environment variables) — JAMAIS en dur dans ce fichier ;
      #   2. déclarer le groupe sous environment: groups: [capgo] ;
      #   3. créer le canal « production » dans le dashboard Capgo — il doit
      #      correspondre exactement à defaultChannel de capacitor.config.ts,
      #      sinon le serveur ne renvoie jamais de bundle, sans erreur visible ;
      #   4. VÉRIFIER LA VERSION DU BUNDLE. Le CLI la prend par défaut dans
      #      package.json ("version": "2.4.0" depuis le 05/08 — c'était "2.4",
      #      deux segments, que le CLI refuse : ce n'est pas du semver) alors
      #      que ce workflow fige la marketing version iOS à 2.3 (étape
      #      « Set build number »).
      #      Capgo compare la version du bundle à celle installée : un bundle
      #      numéroté plus bas que le natif n'est pas servi. Aligner les deux,
      #      ou forcer explicitement avec --bundle <version>.
      #
      # - name: Upload Capgo bundle
      #   script: |
      #     npx @capgo/cli@latest bundle upload app.fillsell.app \
      #       --apikey "$CAPGO_TOKEN" \
      #       --path dist \
      #       --channel production \
      #       --comment "$CM_COMMIT"
      #   # Le CLI refuse l'upload s'il ne trouve pas notifyAppReady() dans les
      #   # sources (garde intégrée). Si ça arrive, c'est une régression de
      #   # src/main.jsx — corriger, surtout ne pas passer --no-code-check.
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
