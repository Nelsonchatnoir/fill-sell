<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>FillSell</title>
  <style>
    /* Space Grotesk bundlée en local (woff2 variable, subset latin) — CSP MV3,
       aucun chargement externe. Source : Google Fonts (OFL).
       La maquette Claude Design (08/09) est dessinée en Nunito 800/900 ; on
       reste sur la police de l'app, comme la landing refondue depuis le même
       projet (.lp-root = Space Grotesk). Le poids plafonne à 700, c'est le
       maximum du fichier embarqué. */
    @font-face {
      font-family: "Space Grotesk";
      font-style: normal;
      font-weight: 300 700;
      font-display: swap;
      src: url("assets/space-grotesk.woff2") format("woff2");
    }

    /* ── Palette de la maquette (08/09) — les mêmes teintes que App.css :
       --teal-strong #1D9E75, --peach #F9A26C, focus #4ECDC4. ── */
    :root {
      --bg:        #F5F6F5;
      --ink:       #0D0D0D;
      --ink-2:     #374151;
      --muted:     #6B7280;
      --muted-2:   #A3A9A6;
      --muted-3:   #9CA3AF;
      --teal:      #1D9E75;
      --teal-2:    #4ECDC4;
      --teal-deep: #0F6E56;
      --teal-soft: #E8F5F0;
      --peach:       #F9A26C;
      --peach-soft:  #FFF4EE;
      --peach-deep:  #9A3412;
      --peach-light: #FFD9BF;
      --card:   #FFFFFF;
      --line:   rgba(0,0,0,0.06);
      --line-2: rgba(0,0,0,0.04);
      --shadow: 0 1px 4px rgba(0,0,0,0.05), 0 4px 16px rgba(0,0,0,0.04);
    }

    * { box-sizing: border-box; }

    /* html AUSSI, pas seulement body : Chrome peint le fond de <html> sur le
       pourtour du popup (coins arrondis + arrondis de pixels aux échelles
       d'affichage fractionnaires type 125 %) — laissé au blanc par défaut,
       c'était le liseré blanc autour du popup. */
    html { background: var(--bg); }

    body {
      width: 380px;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }
    b, strong { font-weight: 700; }
    button { font-family: inherit; }

    /* ── Bandeau de marque ── */
    .topbar {
      position: relative; overflow: hidden;
      background: linear-gradient(135deg, var(--teal), var(--teal-2));
      padding: 14px 16px 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .topbar .sheen {
      position: absolute; top: 0; bottom: 0; left: 0; width: 40%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
      animation: sheen 6s ease-in-out infinite; pointer-events: none;
    }
    .brand-logo {
      width: 34px; height: 34px; border-radius: 9px; display: block; flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }
    .brand { flex: 1; min-width: 0; position: relative; }
    .brand-name { font-weight: 700; font-size: 17px; letter-spacing: -0.02em; color: #fff; line-height: 1.1; }
    .brand-sub {
      font-weight: 700; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
      color: rgba(255,255,255,0.75); margin-top: 2px;
    }
    /* La pastille de compte : « Active » / « Ralentie » / « En veille » quand on
       est connecté (clic = déconnexion en deux temps), « Se connecter » sinon. */
    .pill {
      position: relative;
      display: flex; align-items: center; gap: 7px;
      background: rgba(255,255,255,0.18); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.28); border-radius: 99px;
      padding: 6px 11px 6px 9px; color: #fff; font-weight: 700; font-size: 12px;
      cursor: pointer; white-space: nowrap; transition: background 0.15s;
    }
    .pill:hover { background: rgba(255,255,255,0.28); }
    .pill-dot { width: 8px; height: 8px; border-radius: 99px; background: #fff; display: block; flex-shrink: 0; }
    .pill.active   .pill-dot { animation: pulseW 2.2s ease infinite; }
    .pill.ralentie .pill-dot { background: var(--peach-light); animation: pulseO 2.2s ease infinite; }
    .pill.veille   .pill-dot { background: rgba(255,255,255,0.55); }
    .pill.off      .pill-dot { background: var(--peach-light); }

    /* ── Lignes d'état sous le bandeau ── */
    .bar {
      padding: 9px 16px; background: #fff; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 8px;
      font-weight: 500; font-size: 12px; color: var(--muted); line-height: 1.35;
    }
    .bar b { font-weight: 700; color: var(--ink); }
    .bdot { width: 6px; height: 6px; border-radius: 99px; background: var(--teal); display: block; flex-shrink: 0; }
    .bdot.cold { background: var(--muted-3); }
    .bar-alerte { background: var(--peach-soft); border-bottom-color: rgba(249,162,108,0.35); color: var(--peach-deep); font-weight: 600; }
    .bar-alerte .bdot { background: var(--peach); }
    .bar-awake .bdot { background: var(--peach); }

    /* ── Corps ── */
    .corps { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 18px; }
    .eyebrow {
      font-weight: 700; font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px;
    }
    .eyebrow.soft { color: var(--muted-2); }
    .sec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .sec-head .eyebrow { margin: 0; }
    .pill-mini {
      display: inline-flex; align-items: center; gap: 5px;
      font-weight: 700; font-size: 10px; color: var(--teal); background: var(--teal-soft);
      border-radius: 99px; padding: 3px 8px;
    }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      box-shadow: var(--shadow); overflow: hidden;
    }
    .card.peach { background: var(--peach-soft); border-color: rgba(249,162,108,0.45); }
    .card.encours { border-color: rgba(29,158,117,0.28); }
    .stack { display: flex; flex-direction: column; gap: 8px; }

    /* ── Logos plateformes : tracé SVG sur socle blanc (Vinted, eBay), icône
       d'app PNG plein cadre (Leboncoin, Beebs) — les mêmes visuels que l'app. */
    .plogo {
      width: 32px; height: 32px; border-radius: 9px; background: #fff;
      border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; overflow: hidden;
    }
    .plogo img { width: 18px; height: 18px; display: block; }
    .plogo.ebay img { width: 20px; height: 20px; }
    .plogo.png { border: none; }
    .plogo.png img { width: 100%; height: 100%; object-fit: cover; }
    .plogo.sm { width: 18px; height: 18px; border-radius: 5px; }
    .plogo.sm img { width: 11px; height: 11px; }
    .plogo.sm.ebay img { width: 12px; height: 12px; }
    .plogo.xs { width: 16px; height: 16px; border-radius: 4px; }
    .plogo.xs img { width: 10px; height: 10px; }
    .plogo.png.sm img, .plogo.png.xs img { width: 100%; height: 100%; }

    /* ── Plateformes ── */
    .plat { display: flex; align-items: center; gap: 11px; padding: 11px 14px; border-bottom: 1px solid var(--line-2); }
    .plat:last-child { border-bottom: none; }
    .plat.bloquee { background: var(--peach-soft); align-items: flex-start; }
    .plat-txt { flex: 1; min-width: 0; }
    .plat-ligne { display: flex; align-items: center; gap: 8px; }
    .plat-nom { font-weight: 700; font-size: 14px; color: var(--ink); }
    .plat-sous {
      display: flex; align-items: center; gap: 6px;
      font-weight: 600; font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.45;
    }
    /* État inconnu : la ligne RESTE (la plateforme est là), en gris et sans un
       mot. Faire disparaître la ligne répondait à la question par l'absence —
       on croyait la plateforme retirée. */
    .plat.muette .plogo { opacity: 0.5; filter: grayscale(1); }
    .plat.muette .plat-nom { color: var(--muted-2); }
    .etat { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12px; white-space: nowrap; flex-shrink: 0; }
    .etat.ok { color: var(--teal); }
    .etat.ko { color: var(--peach-deep); }
    .dot { width: 7px; height: 7px; border-radius: 99px; display: block; flex-shrink: 0; }
    .dot.teal  { background: var(--teal); }
    .dot.peach { background: var(--peach); }
    .dot.gris  { background: var(--muted-3); }
    .dot.pulse.teal  { animation: pulseT 2.6s ease infinite; }
    .dot.pulse.peach { animation: pulseO 2.4s ease infinite; }
    .plat-vu { font-weight: 500; font-size: 11px; color: var(--muted-2); margin: 7px 2px 0; }
    .btn-outline {
      font-weight: 700; font-size: 12px; color: var(--teal-deep); background: none;
      border: 1.5px solid var(--teal); border-radius: 99px; padding: 6px 11px;
      white-space: nowrap; cursor: pointer; transition: background 0.15s;
    }
    .btn-outline:hover { background: var(--teal-soft); }
    .lien {
      display: inline-flex; align-items: center; gap: 5px; margin-top: 6px;
      font-weight: 700; font-size: 12px; color: var(--teal-deep);
      background: none; border: none; padding: 0; cursor: pointer;
    }
    .lien:hover { color: var(--teal); }

    /* ── En cours ── */
    .encours { display: flex; gap: 12px; padding: 11px 12px; }
    .thumb {
      width: 78px; height: 78px; border-radius: 12px; flex-shrink: 0; object-fit: cover;
      background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 26px;
    }
    .encours-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .encours-tag { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 11px; color: var(--teal); }
    /* Titre ENTIER, toujours : coupé, il ne permettait pas de distinguer deux
       articles au libellé voisin. */
    .titre { font-weight: 700; font-size: 13.5px; line-height: 1.3; color: var(--ink); overflow-wrap: anywhere; text-wrap: pretty; }
    .barre { margin-top: auto; height: 5px; border-radius: 99px; background: var(--teal-soft); overflow: hidden; }
    .barre-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--teal), var(--teal-2)); animation: bar 7s cubic-bezier(0.3,0.7,0.3,1) infinite; }

    /* ── Prête à publier ── */
    .prete-top { padding: 12px 12px 10px; display: flex; gap: 12px; align-items: center; }
    .prete-body { flex: 1; min-width: 0; }
    .prete-meta { display: flex; align-items: center; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
    .prix { font-weight: 700; font-size: 15px; letter-spacing: -0.03em; }
    .chip {
      display: inline-flex; align-items: center; white-space: nowrap;
      font-weight: 700; font-size: 10px; border-radius: 99px; padding: 3px 8px;
      color: var(--teal-deep); background: var(--teal-soft); border: 1px solid rgba(29,158,117,0.25);
    }
    .prete-etat { display: flex; align-items: center; gap: 5px; margin-top: 7px; font-weight: 600; font-size: 11px; color: var(--teal); line-height: 1.35; }
    .prete-etat.peach { color: var(--peach-deep); }
    .prete-etat.gris { color: var(--muted); }
    .dots { display: inline-flex; gap: 2px; }
    .dots i { width: 4px; height: 4px; border-radius: 99px; background: currentColor; display: block; animation: dots 1.2s ease infinite; }
    .dots i:nth-child(2) { animation-delay: 0.2s; }
    .dots i:nth-child(3) { animation-delay: 0.4s; }
    .prete-bas { border-top: 1px solid var(--line-2); padding: 10px 12px 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .cell {
      display: flex; align-items: center; gap: 7px; padding: 7px 8px; border-radius: 10px;
      background: var(--bg); border: 1px solid rgba(0,0,0,0.05); min-width: 0;
    }
    .cell.teal  { background: var(--teal-soft); border-color: rgba(29,158,117,0.2); }
    .cell.peach { background: var(--peach-soft); border-color: rgba(249,162,108,0.35); }
    .cell.gris .plogo { opacity: 0.55; }
    .cell.gris .cell-nom { color: var(--muted-3); }
    .cell-nom { flex: 1 0 auto; font-weight: 700; font-size: 12px; }
    .cell-etat { display: flex; align-items: center; gap: 3px; white-space: nowrap; font-weight: 700; font-size: 10px; color: var(--teal); }
    .cell-etat.peach { color: var(--peach-deep); }
    /* « Pas dans cet envoi » est plus long qu'une case : il passe sur deux
       lignes plutôt que de chevaucher le nom de la plateforme. */
    .cell-etat.gris { color: var(--muted-2); font-weight: 600; font-size: 9.5px; white-space: normal; text-align: right; line-height: 1.15; }
    .cell .lien { margin: 0; font-size: 10px; }
    .spin {
      width: 9px; height: 9px; border-radius: 99px; flex-shrink: 0;
      border: 2px solid rgba(29,158,117,0.25); border-top-color: var(--teal);
      display: block; animation: spin 0.9s linear infinite;
    }
    .check { width: 10px; height: 10px; flex-shrink: 0; }

    /* ── État vide ── */
    .vide { border: 1.5px dashed rgba(0,0,0,0.1); box-shadow: none; padding: 26px 20px; text-align: center; }
    .vide-ico {
      width: 52px; height: 52px; border-radius: 16px; margin: 0 auto 12px; background: var(--teal-soft);
      display: flex; align-items: center; justify-content: center; font-size: 24px;
      animation: float 4s ease-in-out infinite;
    }
    .vide-t { font-weight: 700; font-size: 14px; }
    .vide-s { font-weight: 500; font-size: 12.5px; line-height: 1.5; color: var(--muted); margin-top: 4px; text-wrap: pretty; }
    .cta {
      display: inline-flex; align-items: center; gap: 6px;
      font-weight: 700; font-size: 12.5px; color: #fff;
      background: linear-gradient(135deg, var(--teal), var(--teal-2));
      border: none; border-radius: 99px; padding: 9px 16px;
      box-shadow: 0 4px 12px rgba(29,158,117,0.3); cursor: pointer; white-space: nowrap;
    }
    .cta:hover { filter: brightness(1.05); }
    .vide .cta { margin-top: 14px; }

    /* ── En attente ── */
    .att { padding: 12px 14px; }
    .att-head { display: flex; align-items: baseline; gap: 8px; }
    .att-n {
      font-weight: 700; font-size: 26px; letter-spacing: -0.03em; line-height: 1;
      background-image: linear-gradient(90deg, #F9A26C 0%, #F9A26C 40%, #FFD9BF 50%, #F9A26C 60%, #F9A26C 100%);
      background-size: 300% 100%; -webkit-background-clip: text; background-clip: text;
      color: transparent; -webkit-text-fill-color: transparent;
      animation: shimmer 4s ease-in-out infinite;
    }
    .att-t { font-weight: 700; font-size: 13px; color: var(--ink); }
    .att-list { display: flex; flex-direction: column; gap: 6px; margin-top: 11px; }
    .motif { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 12.5px; color: var(--ink-2); }
    .motif-n { min-width: 22px; font-weight: 700; font-size: 13px; text-align: right; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .motif-sep { width: 1px; height: 12px; background: rgba(0,0,0,0.08); flex-shrink: 0; }
    .rien { padding: 13px 14px; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 13px; color: var(--ink); }
    .tick {
      width: 26px; height: 26px; border-radius: 99px; background: var(--teal-soft); color: var(--teal);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      animation: tick 0.6s cubic-bezier(0.2,0.8,0.2,1) both;
    }
    .tick .check { width: 13px; height: 13px; }

    /* ── Pourquoi ça attend ── */
    .why { padding: 12px 14px; display: flex; gap: 11px; }
    .why .dot { margin-top: 5px; width: 8px; height: 8px; }
    .why-body { flex: 1; min-width: 0; }
    .why-t { font-weight: 700; font-size: 13px; line-height: 1.35; color: var(--ink); }
    .why-t .qui { color: var(--peach-deep); }
    .why-s { font-weight: 500; font-size: 12px; line-height: 1.5; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
    .why-s b { color: var(--ink-2); }
    .why .lien { margin-top: 8px; }

    /* ── Aussi en file ── */
    .extra { padding: 12px 14px; }
    .extra-l { font-size: 12px; line-height: 1.6; color: var(--muted); font-weight: 500; }
    .extra-l b { color: var(--ink); }

    /* ── Bascule de compte ── */
    .switch-btns { display: flex; gap: 8px; margin-top: 10px; }
    .btn-full { flex: 1; padding: 8px 10px; border-radius: 9px; border: none; background: var(--teal-deep); color: #fff; font-weight: 700; font-size: 12px; cursor: pointer; }
    .btn-ghost { flex: 1; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); font-weight: 700; font-size: 12px; cursor: pointer; }

    /* ── Pied ── */
    .footer {
      padding: 11px 16px 12px; background: #fff; border-top: 1px solid var(--line);
      display: flex; align-items: center; gap: 10px;
    }
    .queue { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12px; color: var(--teal); white-space: nowrap; }
    .queue.zero  { color: var(--muted-2); }
    .queue.pause { color: var(--peach-deep); }
    .qdot { width: 7px; height: 7px; border-radius: 99px; background: var(--teal); display: block; animation: pulseT 2.2s ease infinite; }
    .queue.zero  .qdot { background: #D1D5DB; animation: none; }
    .queue.pause .qdot { background: var(--peach); animation: pulseO 2.2s ease infinite; }
    .spacer { flex: 1; }
    .link-btn { font-weight: 700; font-size: 12px; color: var(--teal-deep); background: none; border: none; cursor: pointer; padding: 2px 0; }
    .link-btn:hover { color: var(--teal); }
    .footer .cta { font-size: 12px; padding: 7px 12px; }
    .diag { padding: 0 16px 8px; background: #fff; text-align: right; font-size: 10px; color: var(--muted-2); font-family: ui-monospace, Menlo, monospace; }

    .hidden { display: none !important; }

    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes pulseT  { 0%, 100% { box-shadow: 0 0 0 0 rgba(29,158,117,0.45); } 70% { box-shadow: 0 0 0 7px rgba(29,158,117,0); } }
    @keyframes pulseO  { 0%, 100% { box-shadow: 0 0 0 0 rgba(249,162,108,0.5); } 70% { box-shadow: 0 0 0 7px rgba(249,162,108,0); } }
    @keyframes pulseW  { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.5); } 70% { box-shadow: 0 0 0 7px rgba(255,255,255,0); } }
    @keyframes shimmer { 0% { background-position: 150% 0; } 100% { background-position: -150% 0; } }
    @keyframes sheen   { 0% { transform: translateX(-120%) skewX(-18deg); } 35%, 100% { transform: translateX(260%) skewX(-18deg); } }
    @keyframes bar     { 0% { width: 8%; } 45% { width: 62%; } 100% { width: 96%; } }
    @keyframes dots    { 0%, 20% { opacity: 0.2; } 40% { opacity: 1; } 100% { opacity: 0.2; } }
    @keyframes float   { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-6px) rotate(4deg); } }
    @keyframes tick    { 0% { transform: scale(0.4); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <!-- Bandeau de marque + pastille de compte -->
  <header class="topbar">
    <div class="sheen"></div>
    <img id="brand-logo" class="brand-logo" src="assets/fillsell-logo.png" alt="FillSell" />
    <div class="brand">
      <div class="brand-name">FillSell</div>
      <div class="brand-sub">Cross-post</div>
    </div>
    <button id="acct" class="pill off" type="button">
      <span class="pill-dot"></span>
      <span id="acct-label">Se connecter</span>
    </button>
  </header>

  <!-- Plateformes qui ont besoin d'un geste : dit une fois, en tête. -->
  <div id="bar-alerte" class="bar bar-alerte hidden"></div>
  <!-- Ligne de vie : dernier passage / prochain. Gratuite et exacte. -->
  <div id="life" class="bar hidden"></div>
  <!-- Maintien en éveil : visible UNIQUEMENT pendant qu'il est actif (2026-09-04). -->
  <div id="awake" class="bar bar-awake hidden"></div>

  <main class="corps">
    <!-- Bascule de compte FillSell en attente d'une décision (2026-09-03) -->
    <section id="switch" class="hidden"></section>

    <!-- État des plateformes : la question qu'on se pose en ouvrant le popup. -->
    <section id="plateformes" class="hidden">
      <div class="eyebrow">Plateformes</div>
      <div id="plat-list"><!-- rendu par popup.js --></div>
    </section>

    <!-- Ce qui tourne en ce moment : qui, et sur quoi -->
    <section id="now" class="hidden"></section>

    <!-- Prochaine annonce à partir + « Diffuser sur » (un ÉTAT, plus une sélection) -->
    <section id="prete">
      <div class="eyebrow">Prête à publier</div>
      <div id="listing-card"><!-- rendu par popup.js --></div>
    </section>

    <!-- Ce qui attend un geste : le nombre, puis les motifs -->
    <section id="attente" class="hidden"></section>

    <!-- Chaque motif avec sa cause et le geste qui la lève -->
    <section id="pourquoi" class="hidden"></section>

    <!-- Le reste de la file : republications, demande de sync -->
    <section id="queue-extra" class="hidden"></section>
  </main>

  <footer class="footer">
