# Matrice des concurrents de FillSell — brief pour les pages comparatives
# Observé le 2026-10-09. Lecture du web seule : aucun compte créé, aucune connexion, aucun formulaire.
# Données internes (brief) : rien ne se publie tel quel ; chaque page reprend la valeur, la source et la
# date, et respecte docs/seo/PLAN.md § 2 (FillSell est notre produit, aucun dénigrement, faits datés).
# Format : YAML lisible en JSON_SCHEMA (dates en chaînes, aucune ancre, aucun type implicite).
# Rapport qui accompagne ce fichier : docs/seo/briefs/concurrents-matrice.md
# MISE À JOUR DU 09/10 SOIR (décisions de Nico du 09/10, elles priment sur la fiche de vérité) : critère
# « depop » ajouté pour les 15 outils (plateformes.depop), ligne FillSell refaite (5 plateformes dont Depop,
# republication automatique sur Vinted, Leboncoin, Beebs et Depop à tous les paliers, aucun chiffre de quota,
# l'ancienne cinquième plateforme retirée), classement recalculé (mêmes critères, mêmes poids) + variante
# « Vendeur Depop ». Le détail des changements est en tête du rapport.
# INTÉGRATION DU 09/10 NUIT : valeurs anglaises ({ fr, en }, traduction fidèle, mêmes sources) pour les seuls
# outils et critères de la comparaison de l'accueil anglais (fillsell, vendoo, crosslist, relistly ×
# plateformes, app_mobile, ia_photo, import_synchro, retrait_auto_copies, republication) ; ligne FillSell :
# « à tous les paliers », « chaque scan compte dans le forfait du mois » et « sans quota » retirés.
# Le mot « cloud » des faits publiés des concurrents (StoFlow, FlowDino, Klork, Crosslist, Relistly) est
# rendu par « serveurs » (même fait, mêmes sources) : aucune occurrence de « Cloud » sur le site.

