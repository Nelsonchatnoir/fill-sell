apply plugin: 'com.android.application'

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) { localPropsFile.withInputStream { localProps.load(it) } }

android {
    namespace = "app.fillsell.app"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        release {
            storeFile     file(localProps['FILLSELL_STORE_FILE'] ?: 'fillsell-release.keystore')
            storePassword localProps['FILLSELL_STORE_PASSWORD'] ?: ''
            keyAlias      localProps['FILLSELL_KEY_ALIAS']      ?: 'fillsell'
            keyPassword   localProps['FILLSELL_KEY_PASSWORD']   ?: ''
        }
    }
    defaultConfig {
        applicationId "app.fillsell.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionName aligné sur iOS (2026-07-22) : codemagic.yaml fige
        // `agvtool new-marketing-version`, donc tout build iOS sort avec ce
        // numéro. Android affichait 2.4 pour le MÊME code — deux numéros pour
        // une seule release. On garde les deux alignés (2.3 = la soumission
        // qui suit la review 2.2 en cours, cf. codemagic.yaml).
        // ⚠️ versionCode, lui, ne recule JAMAIS : Google Play le refuserait.
        // 17 → 18 (23/07 : économie per-scan), 18 → 19 (24/07 : upsell Pro
        // dans la modale du badge + self-heal Stripe côté serveur),
        // 19 → 20 (25/07 : Lens 2 boutons caméra/photothèque multi,
        // patch optimiste retry, anti-republication, premium is_comped),
        // 20 → 21 (26/07 : icônes launcher FillSell — les placeholders
        // Capacitor n'avaient jamais été remplacés — + splash Android 12+
        // via windowSplashScreen*, fond teal #2F9E90, cf. 4b2894e),
        // 21 → 22 (26/07 soir : splash V2 3d65f74 — glyphe blanc pur 13 % sur
        // ink #10201B, ic_splash_icon à 80 % de la zone sûre, flash blanc
        // d'index.html supprimé, fondu 350 ms + hide() au premier render).
        // versionName 2.3.2 : même logique que 2.3.1 — release SANS feature
        // (assets natifs + transition seulement), iOS reste en 2.3 — on
        // réserve 2.4 à la prochaine release commune. Play n'impose rien sur
        // versionName, seul versionCode compte.
        // 22 → 23 (27/07 : modale de retrait — « Récupération du lien en
        // cours… » tant que la re-capture listing_url est retentée (fenêtre
        // 48 h), consigne manuelle réservée à l'échec définitif). 2.3.3 :
        // correctif seul, iOS inchangé, 2.4 toujours réservée.
        // 23 → 24 (27/07 soir : multi-select photos Android — Photo Picker
        // natif dans le stepper via pickImages, gate getPlatform()==='android',
        // iOS/web strictement inchangés). 2.3.4 : correctif seul, iOS
        // inchangé, 2.4 toujours réservée.
        // 25 → 26 (30/07 : PREMIER binaire à embarquer le runtime Capgo
        // (@capgo/capacitor-updater, notifyAppReady en 1re instruction de
        // main.jsx) + tout le main du 29-30/07 : purge du parcours Lens après
        // publication, verrou pending/processing du stepper, prix d'achat
        // obligatoire / inventaire systématique). versionName 2.3.6 (décision
        // Nico 30/07) : la lignée 2.3.x continue, iOS inchangé — 2.4 reste
        // réservée à la prochaine release commune.
        // 26 → 27 (30/07 au soir : lot de correctifs app + refonte de l'écran
        // Lens. Couleurs Vinted normalisées vers la palette fermée (09ddace),
        // champs du stepper qui ne se démontent plus à la 1re frappe (5d4d93c),
        // filet marque Beebs en trace seule (a0ad69c), badges de session relus
        // pendant l'affichage (fce4f2f), règle d'unicité « un champ manquant =
        // un seul encart » (c4c0e37), et AnalyseMarche (f00f650) : un composant
        // partagé écran Lens / stepper, deal score supprimé, verdict dérivé de
        // la marge). versionName 2.3.7 : la lignée 2.3.x continue et 2.4 reste
        // RÉSERVÉE à la prochaine release commune avec iOS (règle posée le
        // 22/07, iOS inchangé ce soir).
        versionCode 27
        versionName "2.3.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
