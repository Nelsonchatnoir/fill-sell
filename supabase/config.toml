# Config déclarative Supabase CLI — verify_jwt de CHAQUE fonction.
#
# ⚠️ SOURCE DE VÉRITÉ pour `supabase functions deploy <nom>`. Le CLI lit ce
# fichier : plus aucun flag --no-verify-jwt à retenir, et surtout plus aucune
# fonction dont le réglage dépend de ce qu'on a tapé la dernière fois.
#
# POURQUOI TOUTES LES FONCTIONS SONT LISTÉES (2026-07-28) : le CLI CONSERVE le
# dernier réglage appliqué. Une fonction non déclarée ici garde donc
# indéfiniment la valeur du dernier deploy — un flag passé par erreur devient
# permanent, et invisible. C'est exactement ce qui est arrivé à lens-analysis
# le 2026-07-28 : un `--no-verify-jwt` de trop l'a basculée à false, et un
# redéploiement SANS le flag ne l'a pas restaurée. Déclarer l'état attendu de
# chaque fonction rend l'erreur impossible : le fichier réimpose la valeur à
# chaque déploiement.
#
# État relevé en prod le 2026-07-28 via list_edge_functions — ces valeurs sont
# constatées, pas supposées. Toute nouvelle fonction doit être ajoutée ici.

project_id = "tojihnuawsoohlolangc"

# ═══════════════════════════════════════════════════════════════════════════
# verify_jwt = false — le gateway laisse passer, l'authentification est faite
# ailleurs (signature du store, x-cron-secret, ou JWT vérifié dans le code).
# ═══════════════════════════════════════════════════════════════════════════

# Webhooks de store : authentifiés par SIGNATURE (JWS Apple, Pub/Sub Google,
# signature Stripe). Un verify_jwt à true les casserait en 401 — les stores
# n'envoient évidemment pas de JWT Supabase. Liste CLAUDE.md.
[functions.apple-iap-webhook]
verify_jwt = false

[functions.google-play-webhook]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# Cron / appels internes : gardés par le header x-cron-secret.
[functions.email-tunnel]
verify_jwt = false

[functions.ops-digest]
verify_jwt = false

[functions.handler-watch]
verify_jwt = false

[functions.apple-notification-history]
verify_jwt = false

[functions.apple-subscription-status]
verify_jwt = false

[functions.tiktok-event]
verify_jwt = false

# Auth applicative interne : Bearer utilisateur vérifié DANS le code (getUser).
[functions.voice-intent]
verify_jwt = false

[functions.check-listing-status]
verify_jwt = false

# Envois d'e-mails déclenchés côté serveur / outils ponctuels.
[functions.send-relance]
verify_jwt = false

[functions.send-batch-notifications]
verify_jwt = false

[functions.email-blast]
verify_jwt = false

[functions.send-merine-reply]
verify_jwt = false

[functions.send-merine-reward]
verify_jwt = false

[functions.send-thomas-reply]
verify_jwt = false

[functions.qa-img-quality-test]
verify_jwt = false

# ═══════════════════════════════════════════════════════════════════════════
# verify_jwt = true — appelées par l'app avec un JWT utilisateur. Le gateway
# rejette avant même d'atteindre le code : c'est le premier rempart, et il ne
# doit jamais tomber par accident.
# ═══════════════════════════════════════════════════════════════════════════

# Fonctions IA (coûtent de l'argent à chaque appel — le gateway est la
# première barrière contre un appel non authentifié).
[functions.lens-analysis]
verify_jwt = true

[functions.generate-listing]
verify_jwt = true

[functions.deal-analysis]
verify_jwt = true

[functions.voice-transcribe]
verify_jwt = true

[functions.voice-parse]
verify_jwt = true

[functions.stats-analysis]
verify_jwt = true

[functions.normalize-title]
verify_jwt = true

[functions.lot-distribute]
verify_jwt = true

# Paiement / compte : le JWT identifie le titulaire, jamais optionnel.
[functions.create-checkout-session]
verify_jwt = true

[functions.cancel-subscription]
verify_jwt = true

[functions.validate-coin-purchase]
verify_jwt = true

[functions.validate-apple-receipt]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.check-early-adopter]
verify_jwt = true

# Publication / extension.
[functions.get-pending-jobs]
verify_jwt = true

[functions.update-job-status]
verify_jwt = true

[functions.fetch-ebay-aspects]
verify_jwt = true

[functions.extension-session]
verify_jwt = true

[functions.send-bug-report]
verify_jwt = true
