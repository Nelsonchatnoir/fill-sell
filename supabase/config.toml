# Config déclarative Supabase CLI — verify_jwt de CHAQUE fonction.
#
# ⚠️ SOURCE DE VÉRITÉ pour `supabase functions deploy <nom>`. Le CLI lit ce
# fichier : plus aucun flag --no-verify-jwt à retenir, et surtout plus aucune
# fonction dont le réglage dépend de ce qu'on a tapé la dernière fois.
#
# POURQUOI TOUTES LES FONCTIONS SONT LISTÉES (2026-07-28) : le CLI CONSERVE le
# dernier réglage appliqué. Une fonction non déclarée ici garde donc
# indéfiniment la valeur du dernier deploy — un flag passé par erreur devient
# permanent, et invisible. C'est exactement ce qui est arrivé à lens-analysis
# le 2026-07-28 : un `--no-verify-jwt` de trop l'a basculée à false, et un
# redéploiement SANS le flag ne l'a pas restaurée. Déclarer l'état attendu de
# chaque fonction rend l'erreur impossible : le fichier réimpose la valeur à
# chaque déploiement.
#
# État relevé en prod le 2026-07-28 via list_edge_functions — ces valeurs sont
# constatées, pas supposées. Toute nouvelle fonction doit être ajoutée ici.

project_id = "tojihnuawsoohlolangc"

# ═══════════════════════════════════════════════════════════════════════════
# verify_jwt = false — le gateway laisse passer, l'authentification est faite
# ailleurs (signature du store, x-cron-secret, ou JWT vérifié dans le code).
# ═══════════════════════════════════════════════════════════════════════════

# Webhooks de store : authentifiés par SIGNATURE (JWS Apple, Pub/Sub Google,
# signature Stripe). Un verify_jwt à true les casserait en 401 — les stores
# n'envoient évidemment pas de JWT Supabase. Liste CLAUDE.md.
[functions.apple-iap-webhook]
verify_jwt = false

[functions.google-play-webhook]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# Cron / appels internes : gardés par le header x-cron-secret.
[functions.email-tunnel]
verify_jwt = false

[functions.ops-digest]
verify_jwt = false

[functions.handler-watch]
verify_jwt = false

# Filet du lien d'annonce Beebs (2026-09-21) : appelée par pg_cron
# (« beebs-lien-5min », x-cron-secret) — jamais par l'app ni par l'extension.
# Elle lit l'index public de Beebs et pose le lien d'un dépôt qui n'en a pas,
# sans attendre que la personne rouvre son navigateur.
[functions.beebs-lien]
verify_jwt = false

[functions.apple-notification-history]
verify_jwt = false

[functions.apple-subscription-status]
verify_jwt = false

# [functions.tiktok-event] — fonction SUPPRIMÉE en prod le 7 septembre 2026
# (décision Nico) : plus aucune donnée ne part vers une régie publicitaire.

# Auth applicative interne : Bearer utilisateur vérifié DANS le code (getUser).
[functions.voice-intent]
verify_jwt = false

[functions.check-listing-status]
verify_jwt = false

# Désinscription publique : appelée depuis la page /desinscription par
# quelqu'un qui n'est PAS connecté — c'est tout l'intérêt. L'authentification
# est la détention du jeton, vérifiée dans le code.
[functions.email-desinscription]
verify_jwt = false

# ── SUPPRIMÉE EN PROD LE 2026-09-23 ───────────────────────────────────────
# send-batch-notifications. Dernière porte d'envoi sans source, et la PIRE des
# 32 : sa garde était `?token=fs2026batch` — le jeton dans l'URL, donc dans
# tous les journaux et tous les proxys — et son paramètre `test_to` permettait
# à qui le connaissait d'envoyer un mail à N'IMPORTE QUELLE adresse. Un relais
# ouvert, en somme. C'est là, et nulle part ailleurs, que vivait `fs2026batch`.
# Son « v20 » avait fait hésiter : ce sont 20 déploiements en 294 SECONDES le
# 06/06/2026 à 21h00, quelqu'un qui itère sur un one-shot — jamais retouchée
# depuis (109 jours). Six destinataires en dur, des excuses personnalisées sur
# un bug de vide-grenier.
# Preuve avant suppression : 0 appelant (code, crons, fonctions SQL, triggers,
# invocations dynamiques énumérées), et 0 appel sur ~95 000 lignes de journaux
# échantillonnées sur 5 jours répartis dans les 30 derniers.
# Sa source a été récupérée, lue, puis JETÉE sans être commitée : elle portait
# le jeton et six adresses réelles.
# Pour un envoi ponctuel, c'est `envoyer_mail_ponctuel()` — cf. CLAUDE.md.

# ── SUPPRIMÉE EN PROD LE 2026-09-20 ───────────────────────────────────────
# send-relance. Elle tournait encore (v195, verify_jwt = false) et son SEUL
# verrou était un jeton en paramètre d URL, écrit en clair dans un fichier que
# .gitignore excluait : illisible, donc jamais changé. Ses campagnes étaient
# toutes parties ; le registre de qui a reçu quoi vit dans email_logs.
# Vérifié AVANT suppression : aucun job pg_cron, aucune fonction SQL, aucun
# code applicatif et aucune autre fonction ne l appelait ; le point d envoi de
# production (email-tunnel) et les envois ponctuels ne dépendent pas d elle.
# Endpoint public relu après : 404.

# ── SUPPRIMÉES EN PROD LE 2026-07-28 ──────────────────────────────────────
# email-blast, send-merine-reply, send-merine-reward, send-thomas-reply et
# qa-img-quality-test étaient encore déployées, toutes en verify_jwt = false,
# dont un envoyeur d'e-mails EN MASSE (email-blast). Vérifié avant suppression :
# aucun code applicatif, aucun cron pg_cron et aucun webhook ne les appelait —
# les trois « send-* » étaient des réponses ponctuelles à un utilisateur nommé,
# écrites une fois et jamais réutilisées.
# ⚠️ handler-watch, elle, N'EST PAS supprimée : le job pg_cron
# « handler-watch-3min » (jobid 5) l'appelle toutes les 3 minutes.

# ═══════════════════════════════════════════════════════════════════════════
# verify_jwt = true — appelées par l'app avec un JWT utilisateur. Le gateway
# rejette avant même d'atteindre le code : c'est le premier rempart, et il ne
# doit jamais tomber par accident.
# ═══════════════════════════════════════════════════════════════════════════

# Fonctions IA (coûtent de l'argent à chaque appel — le gateway est la
# première barrière contre un appel non authentifié).
[functions.lens-analysis]
verify_jwt = true

[functions.generate-listing]
verify_jwt = true

[functions.deal-analysis]
verify_jwt = true

[functions.voice-transcribe]
verify_jwt = true

[functions.voice-parse]
verify_jwt = true

[functions.stats-analysis]
verify_jwt = true

[functions.normalize-title]
verify_jwt = true

# resolve-categorie : DEUX appelants — l'app (JWT utilisateur) et le worker
# eBay (secret cron, il n'a pas de session). L'authentification est faite DANS
# la fonction, qui refuse tout ce qui n'est ni l'un ni l'autre.
[functions.resolve-categorie]
verify_jwt = false

[functions.lot-distribute]
verify_jwt = true

# Re-hébergement des photos d'une annonce Vinted à la capture (É1
# republication, 2026-08-05) : JWT utilisateur obligatoire — sans lui, la
# fonction serait un proxy de téléchargement anonyme vers notre storage.
[functions.republish-capture-photos]
verify_jwt = true

# Purge quotidienne des captures de republication + leurs photos storage
# (cron pg_net, x-cron-secret) — verify_jwt = false comme tous les crons.
[functions.republish-purge]
verify_jwt = false

# Balayage des doublons (2026-09-25, chantier « zéro doublon ») : cron pg_net
# toutes les 2 min (doublons-balayage-2min), x-cron-secret vérifié dans le
# code — empreintes des photos manquantes, puis décisions en base.
[functions.doublons-balayage]
verify_jwt = false

# eBay par API (lot 0, 05/09) : eBay redirige le NAVIGATEUR ici après le
# consentement, sans JWT Supabase — l'identité vient du `state` signé (HMAC,
# clé = client_secret) vérifié dans le code. Nom IMPOSÉ par le RuName eBay.
[functions.ebay-oauth-callback]
verify_jwt = false

# Marketplace Account Deletion (06/09) : c'est eBay qui appelle (GET défi,
# POST notification signée x-ebay-signature), sans JWT Supabase. Efface la
# ligne ebay_accounts du vendeur — et rien d'autre.
[functions.ebay-account-deletion]
verify_jwt = false

# eBay par API, lot 2a (06/09) : worker de publication serveur, appelé par
# pg_cron (x-cron-secret) — jamais par l'app.
[functions.ebay-api-worker]
verify_jwt = false

# Synchronisation des VENTES eBay (19/09) : API d'ordres, serveur seul, appelée
# par pg_cron (x-cron-secret) — jamais par l'app, jamais par l'extension.
[functions.ebay-ventes-sync]
verify_jwt = false

# Paiement / compte : le JWT identifie le titulaire, jamais optionnel.
# eBay par API (lot 0-1, 05/09) : appelées par l'app avec le JWT utilisateur.
[functions.ebay-oauth-start]
verify_jwt = true

[functions.ebay-account]
verify_jwt = true

[functions.create-checkout-session]
verify_jwt = true

[functions.cancel-subscription]
verify_jwt = true

[functions.validate-coin-purchase]
verify_jwt = true

[functions.validate-apple-receipt]
verify_jwt = true

[functions.validate-google-purchase]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.check-early-adopter]
verify_jwt = true

# Publication / extension.
[functions.get-pending-jobs]
verify_jwt = true

# update-job-status : c'est la PROD qui avait raison (décision Nico, 21/09).
# Elle tourne en `false` depuis des semaines sans incident, et ce fichier la
# déclarait `true` — l'écart connu et jamais tranché du 18/09. On aligne le
# fichier sur la prod, pas l'inverse : la basculer à `true` ferait passer par le
# gateway TOUS les verdicts du parc, pour un gain nul.
# ⛔ `false` n'est pas « pas d'authentification », c'est « l'authentification est
# faite par la fonction ». Vérifié sur pièces le 21/09 : `Authorization: Bearer`
# exigé (401 sinon), `userClient.auth.getUser()` qui valide le jeton (401 si
# invalide ou expiré), puis TOUTE lecture et TOUTE écriture par ce client
# utilisateur, donc sous RLS. Le service_role n'est utilisé qu'après ces deux
# gardes, et seulement une fois l'appartenance du job établie par le client
# utilisateur. Le seul retour avant les gardes est le préflight CORS (OPTIONS).
[functions.update-job-status]
verify_jwt = false

[functions.fetch-ebay-aspects]
verify_jwt = true

[functions.extension-session]
verify_jwt = true

[functions.send-bug-report]
verify_jwt = true

# Envoi ponctuel (2026-09-23) : LA fonction qui remplace les 31 one-shots
# supprimées le même jour. verify_jwt = TRUE à dessein — la plateforme rejette
# d'abord tout jeton qui n'est pas signé par ce projet, et la fonction exige
# ENSUITE la clé de service elle-même (un JWT d'utilisateur ordinaire est signé
# par le projet : sans cette seconde garde, n'importe quel compte connecté
# pourrait poster des mails). Aucun jeton en dur, donc rien à fuiter.
[functions.envoi-ponctuel]
verify_jwt = true

# Envoi du lien d'installation à SOI-MÊME (lot 2C-1, 2026-08-09) : le JWT
# désigne le destinataire — l'adresse est lue sur le token, jamais dans le
# corps. verify_jwt = true : sans porteur identifié, la fonction n'a aucun
# destinataire légitime, le gateway doit refuser avant le code.
[functions.send-extension-link]
verify_jwt = true
