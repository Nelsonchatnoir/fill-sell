classement:
  titre: Meilleures applications de crosslisting en France (2026)
  avertissement: 'FillSell est notre produit. Grille écrite AVANT de noter ; FillSell noté avec ses limites (fiche de vérité) et les décisions de Nico du 09/10 (à constater en production le jour de la mise en ligne), les concurrents sur leurs pages publiques (déclarations). Publier la grille, les sous-notes et les variantes de pondération, jamais un seul chiffre.'
  eliminatoire:
    - 'Sert, de façon documentée, un revendeur qui réside en France (exclut Crosslist : UE non servie ; List Perfectly : États-Unis seulement ; Vendoo : places de marché américaines, « You might not be able to actually list to the U.S. marketplaces depending upon your location », app absente de l''App Store FR).'
    - 'Publie sur au moins deux places de marché (exclut Clemz : Vinted seul ; DressKare : Vinted + boutique Shopify ; Margeo : ne publie pas).'
    - 'Activité démontrée au 09/10/2026 : produit mis à jour depuis moins de 90 jours ET service qui répond (exclut Flypr : rien depuis le 18/04/2026, API en 404).'
  criteres:
    - id: C1
      nom: Plateformes utiles en France
      poids: 25
      grille: 'Vinted France publié 7 (source seulement, ou option à prix non public : 4) ; Leboncoin 7 (« bientôt » : 0) ; eBay.fr 4 (site France non nommé 2) ; Beebs 3 (annoncé mais activé compte par compte 1) ; autres places de marché ouvertes (hors bêta) : 1-2 = 2, 3 et plus = 4'
    - id: C2
