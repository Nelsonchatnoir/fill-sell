meta:
  observe_le: 2026-10-09
  niveaux:
    verifie: 'lu sur une page officielle de l''éditeur ou sur sa fiche officielle de store (Chrome Web Store, App Store, Google Play), le 2026-10-09'
    deduit: 'déduit (manifeste d''extension, code servi publiquement, calcul, recoupement) : ce n''est pas une promesse de l''éditeur'
    non_verifiable: 'non vérifiable sans compte, ou pages officielles contradictoires (voir le champ contradictoire)'
    fiche_de_verite: 'FillSell : code et état de production lus le 2026-10-09 (03-fiche-de-verite.md), références F-xx'
    decision_nico: 'FillSell : décision de Nico du 2026-10-09, qui prime sur la fiche de vérité ; à constater en production le jour de la mise en ligne (voir outils[fillsell].a_verifier_a_la_mise_en_ligne)'
  avertissements:
    - 'Les chiffres publiés par les éditeurs (utilisateurs, annonces, délais, précision) sont leurs propres affirmations.'
    - 'Les seuls chiffres tiers sont ceux des stores (Chrome Web Store, App Store, Google Play) et de Trustpilot.'
    - 'Les notes et avis ne vont JAMAIS dans le JSON-LD du site (ARCHITECTURE.md § 5) ; dans le texte, toujours avec le nombre d''avis et la date.'
    - 'Asymétrie de méthode : FillSell est décrit depuis son code (limites comprises), les concurrents depuis leurs pages publiques (déclarations).'
