    fait_bien:
      - 'La couverture la plus large vue en France, Beebs compris (seul autre outil qui l''annonce), plus Etsy et Vestiaire Collective.'
      - 'Passerelle e-commerce : modules Shopify, WooCommerce et PrestaShop publiés, import CSV avec correspondance des colonnes.'
      - 'IA visuelle dès le gratuit (mannequin virtuel, changement de fond) et automatisations planifiées documentées en détail ; essai de 14 jours sans carte.'
    fillsell_fait_pas_lui:
      - 'Apps iOS et Android (FlowDino : feuille de route, Yandex sur Android).'
      - 'Depop : publication, synchronisation, retrait, republication (FlowDino : non, et son comparatif envoie les vendeurs Depop vers les outils américains).'
      - 'Prix proposé par l''IA à partir d''annonces comparables (FlowDino : prix saisi, IA de prix en feuille de route).'
      - 'eBay par l''API officielle, publication même ordinateur éteint (FlowDino : par l''extension, navigateur ouvert).'
      - 'Import gratuit et sans limite, Beebs compris (FlowDino : borné par le plan, Beebs non cité).'
      - Rapprochement d'un même article entre plateformes (non décrit chez FlowDino).
      - 'Retrait des copies prouvées, y compris d''annonces importées (FlowDino : annonces publiées avec FlowDino).'
      - 'Un forfait pour toutes les plateformes et un stock sans limite d''articles (FlowDino : prix par site, 50 à 15 000 articles).'
    lui_fait_pas_fillsell:
      - Etsy et Vestiaire Collective
      - 'Vinted hors de France d''après le manifeste (23 domaines) — déduit, non promis.'
      - 'Modules de boutique (Shopify, WooCommerce, PrestaShop).'
      - 'Mannequin virtuel et changement de fond dès le plan gratuit (FillSell : retouche à partir de Premium).'
      - 'Échange de vues et de favoris, réponses automatiques aux favoris, bordereaux.'
      - 'Essai de 14 jours, prix annuels, prix d''entrée de 7,99 € pour un seul site.'
