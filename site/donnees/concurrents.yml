    - id: C4
      nom: Créer l'annonce depuis une photo
      poids: 10
      grille: 'photo → objet, titre, description, prix, inclus au palier d''entrée 10 ; même chose mais palier élevé, option payante ou reconnaissance non décrite 8 ; photo → titre et description sans prix 6 ; IA de texte seulement 3 ; +1 si retouche ou mise en scène photo dès l''entrée ; -1 si l''IA écrit en anglais par défaut ; plafond 10'
    - id: C5
